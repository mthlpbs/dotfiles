# External JS Scripts
# --js-runtimes "C:\Users\LENOVO\AppData\Local\Microsoft\WinGet\Links\deno.exe"
--remote-components ejs:github

# Save files to a custom folder
--output "%USERPROFILE%\Downloads\%(title)s.%(ext)s"

# Best video and audio quality
-f "bestvideo[height<=720]+bestaudio/best[height<=720]"

# Embed subtitles if available
--write-auto-subs
--sub-lang "en"
--embed-subs

# Embed thumbnail
--write-thumbnail
--embed-thumbnail

# Embed the infojson as an attachment to mkv/mka video files
--embed-info-json

# Add metadata to files
--add-metadata
--embed-metadata

# Embed chapters
--embed-chapters

# Merge formats into MKV (not MP4 as comment says)
--merge-output-format "mkv"


# Use aria2c for faster downloads (if installed)
--external-downloader aria2c
--external-downloader-args "aria2c:-x 16 -k 1M"

# Skip download if file already exists
--no-overwrites

# Save download archive to avoid duplicates
--download-archive "%USERPROFILE%\Documents/yt-dlp/archive.txt"

# FFmpeg location
--ffmpeg-location "C:\Users\LENOVO\AppData\Local\Microsoft\WinGet\Links"

# Cookies file
--cookies "D:\Codespace\Python\keep\cookies\youtube.txt" 